sonar.projectKey=chalice-devops-lab
sonar.projectName=AWS Chalice DevOps Lab
sonar.projectVersion=1.0.0

sonar.sources=app.py,chalicelib
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=.venv/**,htmlcov/**,reports/**,coverage.xml,docs/**,monitoring/**,scripts/**,docker/**,sonar/**,.github/**,**/__pycache__/**,**/*.pyc
sonar.test.inclusions=tests/**/*.py
sonar.cpd.exclusions=tests/**

# IMPORTANT: no token here. SONAR_TOKEN is injected via environment by make/CI.
# sonar.token must never be committed.
