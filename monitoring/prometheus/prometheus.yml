global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: chalice-app
    metrics_path: /metrics
    static_configs:
      - targets: ["chalice-api:8000"]
        labels:
          service: chalice-api

  - job_name: blackbox-http
    metrics_path: /probe
    static_configs:
      - targets: ["http://chalice-api:8000/health"]
        labels:
          endpoint: health
          module: http_health
      - targets: ["http://chalice-api:8000/ready"]
        labels:
          endpoint: ready
          module: http_ready
      - targets: ["http://chalice-api:8000/hello"]
        labels:
          endpoint: hello
          module: http_hello
      - targets: ["http://chalice-api:8000/version"]
        labels:
          endpoint: version
          module: http_version
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [module]
        target_label: __param_module
      - target_label: __address__
        replacement: blackbox-exporter:9115
